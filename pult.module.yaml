# yaml-language-server: $schema=https://raw.githubusercontent.com/lonic-software/pult/main/pult.schema.json
#
# The module consumers get. Add this repo as a pult source and you get an
# `install` command; run it (or `pult install claude powerup`) to copy the
# skills into your coding tool's config.
#
#   includes:
#     - source: github.com/lonic-software/agent-skills@v2
#       prefix: skills        # -> `pult skills:install`
#
# Real logic lives in bin/install (a directory module, so the whole tree is
# trust-covered). `tool` is a param, not a prefix, so more tools than Claude
# can be added later without changing the command surface.
version: 1
name: agent-skills
description: Install the powerup workflow skills into your coding tool's config.

commands:
  - id: install
    title: Install a powerup skill
    description: >
      Copy a workflow skill — and the agents it needs — into your coding tool's
      config. Pick "powerup" to install the full disciplined-workflow bundle
      (all five skills + their agents), or "powerup-auto" for that bundle plus
      the unattended queue runner; pick a single skill for just that one.
      "test-filter-hook" copies the hook and prints the settings entry to add.
    params:
      # Only "claude" today; the list grows as other tools (codex, …) are ported.
      tool:
        pick:
          options: [claude]
      # powerup first: it's the bundle and the recommended entry point.
      skill:
        pick:
          options: [powerup, powerup-auto, consult, design-doc, delivery, evolve, queue-run, test-filter-hook]
    run: "${module.dir}/bin/install {tool} {skill}"

  - id: check-sync
    title: Check installed skills against this repo
    description: >
      Report drift between the skills and agents this repo ships and the copies
      installed in your coding tool's config. Read-only: it never copies or
      edits anything, because it cannot know which side is newer — it prints
      what differs and leaves the direction to you. Skills of your own that
      this repo does not ship are ignored, not reported as drift.
      Exits 0 when in sync, 2 on drift.
    params:
      tool:
        pick:
          options: [claude]
    run: "${module.dir}/bin/check-sync {tool}"
