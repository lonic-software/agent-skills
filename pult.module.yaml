# yaml-language-server: $schema=https://raw.githubusercontent.com/lonic-software/pult/main/pult.schema.json
#
# The module consumers get. Add this repo as a pult source and you get an
# `install` command; run it (or `pult install claude powerup`) to copy the
# skills into your coding tool's config.
#
#   includes:
#     - source: github.com/lonic-software/agent-skills@v2
#       prefix: skills        # -> `pult skills:install`
#
# Real logic lives in bin/install (a directory module, so the whole tree is
# trust-covered). `tool` is a param, not a prefix, so more tools than Claude
# can be added later without changing the command surface.
version: 1
name: agent-skills
description: Install the powerup workflow skills into your coding tool's config.

commands:
  - id: install
    title: Install a powerup skill
    description: >
      Copy a workflow skill — and the agents it needs — into your coding tool's
      config. Pick "powerup" to install the full disciplined-workflow bundle
      (all five skills + their agents), or "powerup-auto" for that bundle plus
      the unattended queue runner; pick a single skill for just that one.
      "powerup-fleet" adds the concurrent queue fleet; "queue-fleet" is that fleet
      without the powerup workflow. "test-filter-hook" and
      "gate-hook" copy a hook and print the settings entry to add.
    params:
      # Only "claude" today; the list grows as other tools (codex, …) are ported.
      tool:
        pick:
          options: [claude]
      # powerup first: it's the bundle and the recommended entry point.
      skill:
        pick:
          options: [powerup, powerup-auto, powerup-fleet, consult, design-doc, delivery, evolve, queue-run, queue-fleet, test-filter-hook, gate-hook]
    run: "${module.dir}/bin/install {tool} {skill}"

  - id: check-sync
    title: Check installed skills against this repo
    description: >
      Report drift between the skills and agents this repo ships and the copies
      installed in your coding tool's config. Read-only: it never copies or
      edits anything, because it cannot know which side is newer — it prints
      what differs and leaves the direction to you. Skills of your own that
      this repo does not ship are ignored, not reported as drift.
      Exits 0 when in sync, 2 on drift.
    params:
      tool:
        pick:
          options: [claude]
    run: "${module.dir}/bin/check-sync {tool}"

  - id: codex-install
    title: Preview or install global or project Codex skills
    description: Preview by default. Apply only after reviewing the exact files. Existing differences are refused; use a reviewed update plan instead.
    params:
      scope:
        pick:
          options: [global, project]
      project:
        input: { default: "." }
      skill:
        pick:
          options: [powerup-auto, powerup, consult, design-doc, delivery, evolve, queue-run, test-filter-hook, core-preview, full-preview]
      apply:
        flag:
          arg: --apply
    run: 'node ${module.dir}/bin/install-codex.cjs --scope {scope} --project {project} --skill {skill} {apply}'

  - id: codex-check-sync
    title: Check global or project Codex files
    description: Read-only comparison. Exit 2 means missing or changed files.
    params:
      scope:
        pick:
          options: [global, project]
      project:
        input: { default: "." }
      skill:
        pick:
          options: [powerup-auto, powerup, consult, design-doc, delivery, evolve, queue-run, test-filter-hook, core-preview, full-preview]
    run: 'node ${module.dir}/bin/install-codex.cjs --scope {scope} --project {project} --skill {skill} --check'

  - id: codex-update-plan
    title: Prepare a Codex update with backups
    description: Save exact old and proposed bytes in a new plan. Project files stay unchanged. Review the printed SHA-256 and file list before applying.
    params:
      scope:
        pick:
          options: [global, project]
      project:
        input: { default: "." }
      skill:
        pick:
          options: [powerup-auto, powerup, consult, design-doc, delivery, evolve, queue-run, test-filter-hook, core-preview, full-preview]
      plan:
        input: {}
    run: 'node ${module.dir}/bin/manage-codex.cjs preview --scope {scope} --project {project} --skill {skill} --plan {plan}'

  - id: codex-update
    title: Apply or roll back an approved Codex plan
    description: Requires the exact reviewed plan and SHA-256. Refuses files changed since preview or deployment. Does not activate hooks or change configuration.
    params:
      project:
        description: Base directory for a relative plan path. The approved plan identifies the installation root.
        input: { default: "." }
      action:
        pick:
          options: [apply, rollback]
      plan:
        input: {}
      approved-sha256:
        input: {}
    run: 'node ${module.dir}/bin/manage-codex.cjs {action} --project {project} --plan {plan} --approved-sha256 {approved-sha256}'
